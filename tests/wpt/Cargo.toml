[package]
name = "boa_wpt"
publish = false
version = "0.1.0"
edition = "2021"

[dependencies]
boa_engine = { path = "../../core/engine" }
boa_gc = { path = "../../core/gc" }
boa_runtime = { path = "../../core/runtime", features = ["all"] }
rstest = "0.25.0"
url = { version = "2.5.4", features = [] }
tokio = { version = "1.0", features = ["rt", "net", "io-util", "macros", "sync", "fs"] }
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[build-dependencies]
git2 = "0.20.2"
toml = "0.8.23"
serde = { version = "1.0.219", features = ["derive"] }
